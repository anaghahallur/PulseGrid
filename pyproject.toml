[project]
name = "icu-bed-demand-forecasting"
version = "0.1.0"
description = "ICU Bed Demand Forecasting system using Kafka, Hadoop HDFS, Scikit-learn, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "confluent-kafka>=2.3.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]
serving = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["integration: integration test requiring live services"]
addopts = "-v --tb=short"
